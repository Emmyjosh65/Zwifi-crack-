<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>zwifi WiFi Cracker</title>
 <style>
:root {
 --bg: #0f0f13;
 --panel: #1a1a24;
 --primary: #00ff88;
 --text: #e0e0e0;
 --text-muted: #888;
 }
 body {
 font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
 background-color: var(--bg);
 color: var(--text);
 display: flex;
 justify-content: center;
 align-items: center;
 min-height: 100vh;
 margin: 0;
 }
.container {
 width: 100%;
 max-width: 500px;
 background: var(--panel);
 padding: 2rem;
 border-radius: 12px;
 box-shadow: 0 10px 30px rgba(0,0,0,0.5);
 text-align: center;
 }
 h1 {
 margin: 0 0 1.5rem;
 color: var(--primary);
 font-size: 1.8rem;
 letter-spacing: 1px;
 }
.status-box {
 background: #000;
 padding: 1rem;
 border-radius: 8px;
 margin-bottom: 1.5rem;
 border: 1px solid #333;
 }
.status-text {
 font-family: 'Courier New', monospace;
 font-size: 0.9rem;
 color: var(--primary);
 min-height: 1.2em;
 }
.network-list {
 list-style: none;
 padding: 0;
 margin: 0 0 1.5rem;
 text-align: left;
 }
.network-item {
 background: rgba(255,255,255,0.05);
 margin-bottom: 8px;
 padding: 12px;
 border-radius: 6px;
 cursor: pointer;
 transition: background 0.2s;
 display: flex;
 justify-content: space-between;
 align-items: center;
 }
.network-item:hover {
 background: rgba(0, 255, 136, 0.1);
 }
.network-item.active {
 background: rgba(0, 255, 136, 0.2);
 border: 1px solid var(--primary);
 }
.btn {
 background: var(--primary);
 color: #000;
 border: none;
 padding: 12px 24px;
 font-size: 1rem;
 font-weight: bold;
 border-radius: 6px;
 cursor: pointer;
 width: 100%;
 transition: opacity 0.2s;
 }
.btn:disabled {
 opacity: 0.5;
 cursor: not-allowed;
 }
.btn:hover:not(:disabled) {
 opacity: 0.9;
 }
.result {
 margin-top: 1.5rem;
 padding: 1rem;
 background: #000;
 border-radius: 8px;
 display: none;
 }
.result.success {
 border: 1px solid var(--primary);
 display: block;
 }
.result.error {
 border: 1px solid #ff4757;
 display: block;
 }
.password-display {
 font-size: 1.4rem;
 color: var(--primary);
 font-weight: bold;
 letter-spacing: 2px;
 word-break: break-all;
 }
 </style>
</head>
<body>
 <div class="container">
 <h1>zwifi WiFi Cracker</h1>
 
 <div class="status-box">
 <div class="status-text" id="status">Initializing...</div>
 </div>

 <ul class="network-list" id="networkList">
 <!-- Networks will be injected here -->
 </ul>

 <button class="btn" id="crackBtn" disabled>Crack Password</button>

 <div class="result" id="resultBox">
 <div>Found Password:</div>
 <div class="password-display" id="passwordOutput"></div>
 </div>
 </div>

 <script>
 const statusEl = document.getElementById('status');
 const listEl = document.getElementById('networkList');
 const crackBtn = document.getElementById('crackBtn');
 const resultBox = document.getElementById('resultBox');
 const passwordOutput = document.getElementById('passwordOutput');

 let currentSSID = null;

 // Fetch available networks
 async function fetchNetworks() {
 statusEl.textContent = 'Scanning for WiFi networks...';
 crackBtn.disabled = true;
 
 try {
 const response = await fetch('/api/networks');
 const data = await response.json();
 
 if (data.error) {
 statusEl.textContent = 'Error: ' + data.error;
 return;
 }

 if (data.networks.length === 0) {
 statusEl.textContent = 'No networks found.';
 return;
 }

 renderNetworks(data.networks);
 statusEl.textContent = `${data.networks.length} networks found. Select one to crack.`;
 } catch (err) {
 statusEl.textContent = 'Failed to connect to server.';
 }
 }

 function renderNetworks(networks) {
 listEl.innerHTML = '';
 networks.forEach(net => {
 const li = document.createElement('li');
 li.className = 'network-item';
 li.innerHTML = `
 <span>${net.ssid}</span>
 <span style="font-size: 0.8rem; color: #888;">${net.encryption}</span>
 `;
 li.onclick = () => selectNetwork(net.ssid, li);
 listEl.appendChild(li);
 });
 }

 function selectNetwork(ssid, element) {
 // Remove active class from all
 document.querySelectorAll('.network-item').forEach(el => el.classList.remove('active'));
 // Add to clicked
 element.classList.add('active');
 currentSSID = ssid;
 statusEl.textContent = `Selected: ${ssid}`;
 crackBtn.disabled = false;
 }

 // Start cracking process
 crackBtn.onclick = async () => {
 if (!currentSSID) return;
 
 resultBox.className = 'result';
 resultBox.style.display = 'none';
 crackBtn.disabled = true;
 statusEl.textContent = 'Capturing handshake...';

 try {
 const response = await fetch('/api/crack', {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({ ssid: currentSSID })
 });
 const data = await response.json();

 if (data.success) {
 resultBox.className = 'result success';
 passwordOutput.textContent = data.password;
 statusEl.textContent = 'Password found!';
 } else {
 resultBox.className = 'result error';
 passwordOutput.textContent = data.message || 'Failed to crack.';
 statusEl.textContent = 'Cracking failed.';
 }
 } catch (err) {
 statusEl.textContent = 'Connection error.';
 }
 };

 // Initial scan
 fetchNetworks();
 </script>
</body>
</html>
